name: Update Google JWKS

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Google certificates
        run: |
          curl --fail --silent --show-error \
            https://www.googleapis.com/oauth2/v3/certs \
            -o certs.json

      - name: Check certificate file
        run: |
          python - <<'PY'
          import json

          with open("certs.json", "r") as f:
              data = json.load(f)

          if "keys" not in data:
              raise Exception("Invalid JWKS response")

          print(f"Found {len(data['keys'])} keys")
          PY

      - name: Commit updated certificates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add certs.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Google JWKS"
            git push
          fi
